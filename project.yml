name: KickUnblock

options:
  bundleIdPrefix: com.mxfia19
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO
    SUPPORTS_MACCATALYST: NO

targets:
  KickUnblock:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: Sources

    # Pas de bloc `info:` : xcodegen réécrirait Info.plist (comme pour
    # TwitchUnblock). Version et build : posés par la CI.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mxfia19.KickUnblock
        PRODUCT_NAME: KickUnblock
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: ""
        DEVELOPMENT_TEAM: ""
